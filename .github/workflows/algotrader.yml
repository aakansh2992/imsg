name: algotrader

on:
  push:
    branches: [ main ]
    paths: [ 'algotrader/**' ]
  pull_request:
    paths: [ 'algotrader/**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        working-directory: algotrader
        run: python -m unittest discover -s tests -v
